{% extends "base.html" %}
{% block title %}
Delete Trek
{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
    <h2>Confirm Deletion</h2>
    <p>
        Are you sure you want to delete <strong>{{ trek.name }}</strong>?
    </p>
    <form method="POST">
        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>
        <a href="/admin/treks" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
